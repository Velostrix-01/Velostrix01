/* keep using your root variables (from index.html) */

/* overlay — more depth, smoother blur */
#menuOverlay{

  pointer-events:none;

  z-index:900;
}

/* popup container — frosted glass card, rounded, with subtle gold rim */
#menuPopup{
  position:fixed;
  top:50%;
  left:50%;

  z-index:901;
  overflow:hidden;
  user-select: none;
}

/* visible state */
#menuOverlay.active{ opacity:1; pointer-events:auto; }
#menuPopup.active{

let isLongPress = false;

function closeContextMenu(){

document.getElementById("chatContextMenu").style.display="none";
document.getElementById("contextOverlay").style.display="none";

}
    
    /* ========= Robust close-for-context-menu (paste after closeContextMenu) ========= */

(function initContextMenuClose() {
  const menu = document.getElementById("chatContextMenu");
  const overlay = document.getElementById("contextOverlay");

  // ensure overlay click closes (idempotent — won't add duplicates)
  if (overlay && !overlay.dataset.hooked) {
    overlay.addEventListener("click", closeContextMenu);
    overlay.dataset.hooked = "1";
    // ensure overlay can receive pointer events when visible
    overlay.style.pointerEvents = "auto";
  }

  // prevent clicks inside menu from bubbling up to document
  if (menu && !menu.dataset.hooked) {
    menu.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
    });
    menu.dataset.hooked = "1";
  }

  // global pointer handler: if menu is visible and pointerdown is outside -> close
  // pointerdown covers mouse/touch/pen in modern browsers
  if (!document._contextMenuPointerHooked) {
    document.addEventListener("pointerdown", (e) => {
      // quick checks
      if (!menu) return;
      const isVisible = menu.style.display && menu.style.display !== "none";
      if (!isVisible) return;

      // if clicked outside the menu element -> close it
      if (!menu.contains(e.target)) {
        closeContextMenu();
      }
    }, true); // use capture to catch events early
    document._contextMenuPointerHooked = true;
  }

  // also close on Escape key
  if (!document._contextMenuEscHooked) {
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeContextMenu();
    });
    document._contextMenuEscHooked = true;
  }
})();

/* ================= JS tweaks (replace old openMenu / closeMenu + overlay hookup) */

/* open and close that use class toggles (safer than repeated addEventListener) */
function openMenu() {
  document.getElementById("menuPopup").classList.add("active");

    // ---- enhanced renderMarkdown (paste over existing) ----
marked.setOptions({
  gfm: true,
  breaks: true,
  headerIds: true,
  smartLists: true,
  smartypants: false
});

function renderMarkdown(text){
  // 1) extract math placeholders so marked doesn't mangle them
  const mathBlocks = [];
  const mathPlaceholder = (i) => `@@MATH${i}@@`;

  // block math $$...$$
  text = text.replace(/\$\$([\s\S]+?)\$\$/g, (m, expr) => {
    const idx = mathBlocks.push({expr, display: true}) - 1;
    return mathPlaceholder(idx);
  });

  // inline math $...$
  text = text.replace(/\$([^\$\n]+?)\$/g, (m, expr) => {
    const idx = mathBlocks.push({expr, display: false}) - 1;
    return mathPlaceholder(idx);
  });

  // 2) convert markdown -> HTML
  let html = marked.parse(text);

  // 3) restore math placeholders using KaTeX (fallback to sanitized code if KaTeX fails)
  html = html.replace(/@@MATH(\d+)@@/g, (m, id) => {
    const mb = mathBlocks[Number(id)];
    try {
      return katex.renderToString(mb.expr, {displayMode: !!mb.display, throwOnError: false});
    } catch (e) {
      return `<code>${DOMPurify.sanitize(mb.expr)}</code>`;
    }
  });

  // 4) sanitize output
  const clean = DOMPurify.sanitize(html, {
    ALLOWED_TAGS: false, // keep default allowlist
    ALLOW_DATA_ATTR: false
  });

  // 5) post-process links to open in new tab safely
  const container = document.createElement('div');
  container.innerHTML = clean;
  container.querySelectorAll('a').forEach(a => {
    a.setAttribute('target', '_blank');
    a.setAttribute('rel', 'noopener noreferrer');
  });

  // 6) ensure code highlighting runs (if you rely on hljs)
  setTimeout(()=> {
    container.querySelectorAll('pre code').forEach(block => {
      try { hljs.highlightElement(block); } catch(e) {}
    });
  }, 0);

  return container.innerHTML;
}

function saveCurrentChat() {

function renderHistoryList(){
    const list = document.getElementById("historyList");
    const search = document.getElementById("historySearch")?.value.toLowerCase() || "";
    if(!list) return;
    list.innerHTML = "";

    chatHistory
    .slice()
    .reverse()
    .filter(chat => chat.title.toLowerCase().includes(search))
    .forEach(chat => {
        const lastMsg = chat.messages?.[chat.messages.length - 1]?.content || "";
        const item = document.createElement("div");
        item.className = "history-item";

        if(chat.id === currentChatId){
            item.style.background = "#2a2a2a";
            item.style.border = "1px solid #8a1e49";
        }

        // per-item touch vars (closure)
        let touchStartX = 0, touchStartY = 0;
        let touchMoved = false;
        let suppressClick = false;

        item.addEventListener("touchstart", (e) => {
            isLongPress = false;
            touchMoved = false;
            const t = e.touches ? e.touches[0] : e;
            touchStartX = t.clientX;
            touchStartY = t.clientY;

            longPressTimer = setTimeout(()=>{
                isLongPress = true;
                selectedChatId = chat.id;
                suppressClick = true;
                setTimeout(()=> suppressClick = false, 400);

                const menu = document.getElementById("chatContextMenu");
                const overlay = document.getElementById("contextOverlay");
                menu.style.display = "flex";
                overlay.style.display = "block";
                menu.style.left = "50%";
                menu.style.top = "50%";
                menu.style.transform = "translate(-50%,-50%)";
            }, 500);
        }, {passive: true});

        item.addEventListener("touchmove", (e) => {
            const t = e.touches ? e.touches[0] : e;
            if(Math.abs(t.clientX - touchStartX) > 10 || Math.abs(t.clientY - touchStartY) > 10){
                touchMoved = true;
                clearTimeout(longPressTimer);
                isLongPress = false;
            }
        }, {passive: true});

        item.addEventListener("touchcancel", () => {
            clearTimeout(longPressTimer);
            isLongPress = false;
            touchMoved = true;
        });

        item.addEventListener("touchend", (e) => {
            clearTimeout(longPressTimer);
            if(isLongPress) { isLongPress = false; return; }
            if(touchMoved) return;
            loadChat(chat.id);
        });

        item.addEventListener("click", (e) => {
            if(suppressClick) return;
            loadChat(chat.id);
        });

        const titleWrap = document.createElement("div");
        const title = document.createElement("div");
        title.className = "history-title";
        title.innerText = chat.title;

        const preview = document.createElement("div");
        preview.className = "history-preview";
        preview.innerText = lastMsg.slice(0,40);

        titleWrap.appendChild(title);
        titleWrap.appendChild(preview);

        // NOTE: no inline action buttons here — context menu only
        item.appendChild(titleWrap);
        list.appendChild(item);
    });
}
    
    
    /* ---------------- History rename / delete helpers ---------------- */

let pendingDeleteId = null;

function renameChat(id){
  const chat = chatHistory.find(c => c.id === id);
  if(!chat){
    console.warn("renameChat: chat not found", id);
    return;
  }

  // simple prompt-based rename (keeda-free, no UI changes needed)
  const newTitle = prompt("Rename chat:", chat.title);
  if(newTitle === null) return;           // user cancelled
  const trimmed = newTitle.trim();
  if(trimmed.length === 0) return;        // ignore empty rename

  chat.title = trimmed;
  localStorage.setItem("rozel_chats", JSON.stringify(chatHistory));
  renderHistoryList();
}

function deleteChat(id){
  // show confirmation modal (existing #deleteConfirm element)
  pendingDeleteId = id;
  const modal = document.getElementById("deleteConfirm");
  if(modal) modal.style.display = "flex";
  else {
    // fallback: immediate delete if modal missing
    _performDelete(id);
  }
}

function closeDelete(){
  pendingDeleteId = null;
  const modal = document.getElementById("deleteConfirm");
  if(modal) modal.style.display = "none";
}

function confirmDelete(){
  if(!pendingDeleteId){
    closeDelete();
    return;
  }
  _performDelete(pendingDeleteId);
  closeDelete();
}

function _performDelete(id){
  const idx = chatHistory.findIndex(c => c.id === id);
  if(idx === -1) return;
  // remove chat from history
  chatHistory.splice(idx, 1);

  // if deleted chat was open, reset view
  if(currentChatId === id){
    currentChatId = null;
    currentMessages = [];
    startNewChat(); // resets UI & history view
  } else {
    // just re-render history
    renderHistoryList();
  }

  localStorage.setItem("rozel_chats", JSON.stringify(chatHistory));
}
